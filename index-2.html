<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>O Clube dos Contemporâneos Mortos</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1a4fd6;
      min-height: 100vh;
      font-family: 'Playfair Display', serif;
      color: #fff;
    }
    .page {
      max-width: 680px;
      margin: 0 auto;
      padding: 60px 32px 100px;
    }
    .cover-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 48px;
      animation: rise 0.9s ease both;
    }
    .cover-wrap img {
      width: 100%;
      max-width: 480px;
      display: block;
      box-shadow: 0 28px 80px rgba(0,0,0,0.45);
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.2);
      margin: 56px 0;
    }
    .bookshops { animation: rise 0.9s 0.3s ease both; }
    .section-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-bottom: 28px;
    }
    .bookshop-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .bookshop-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .bookshop-name {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }
    .bookshop-city {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.08em;
    }
    .bookshop-link {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.3);
      display: inline-block;
      transition: color 0.2s, border-color 0.2s;
    }
    .bookshop-link:hover { color: #fff; border-color: #fff; }
    .placeholder {
      font-family: 'Space Mono', monospace;
      font-size: 18px;
      font-style: normal;
      font-weight: 400;
      color: #ff2d9b;
    }
  </style>
</head>
